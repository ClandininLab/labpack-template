name: tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      # Hardware drivers are stubbed in the tests, so nothing here needs a rig. What is being
      # checked is the bytes a driver would send and the shape of the protocols -- the things that
      # are wrong silently.
      - name: Tests
        run: pytest -m "not hardware"
