name: tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # System libraries PyQt6 needs on a headless runner -- the same set stimpack's own CI
      # installs for its offscreen Qt tests. Importing PyQt6 dlopens these even when no window is
      # ever created, which is exactly what the labpack check below does.
      - name: Install system libraries (headless Qt)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dri libgl1 libglx-mesa0 \
            libegl1 libegl-mesa0 libopengl0 \
            libglib2.0-0 libxkbcommon0 libdbus-1-3

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      # Validates the labpack against the stimpack that was just installed: --deep imports every
      # protocol, runs it against a recording manager, and reports stimulus names that will not
      # resolve and calls addressed nowhere -- the mistakes that are otherwise silent until a rig
      # runs them. This is what notices stimpack changing how labpacks talk to it, since a
      # template copy has no git history to pull fixes from (see README).
      - name: Check labpack
        env:
          QT_QPA_PLATFORM: offscreen   # the client module imports PyQt6; no display on a runner
        run: stimpack --check-labpack --deep --labpack-dir .

      # Hardware drivers are stubbed in the tests, so nothing here needs a rig. What is being
      # checked is the bytes a driver would send and the shape of the protocols -- the things that
      # are wrong silently.
      - name: Tests
        run: pytest -m "not hardware"
