experimenter: JohnDoe

subject_metadata:  # Any metadata you want to collect per subject; each becomes a dropdown in the GUI.
                   # The GUI has built-ins for subject_id, age and notes.
  species: [D. melanogaster, M. musculus, H. sapiens]
  genotype: ['', PV-Cre, VIP-Cre, SST-Cre]  # an empty first entry means "no default selection"
  # sex: [Female, Male]

rig_config:  # One entry per rig; the GUI asks which one you are on at startup.

  Laptop:  # Everything on one machine: the GUI starts its own local server.
    data_directory: /home/johndoe/Desktop
    screen_center: [0, 0]      # rig-specific offset added by protocol.adjust_center()
    loco_available: False
    server_options:
      use_remote_server: False

  Rig_w_local_server:  # The GUI launches a rig server script on this same machine.
    data_directory: /home/johndoe/Desktop
    screen_center: [0, 0]
    loco_available: True

    # Anything else here is yours: stimpack passes rig_config through untouched, so put rig-specific
    # hardware details in your own keys and read them in your labpack protocol. Stimpack knows the
    # rig can output voltage (see below); only you know an LED is wired to DAC0 at <= 5 V.
    # opto: {channel: DAC0, max_amp: 5.0}
    # The trigger class must be defined in your daq module (module_paths.daq below).
    # trigger: NIUSB6210(dev='Dev5', trigger_channel='ctr0')
    server_options:
      use_remote_server: False
      local_server_path: server/example_server.py   # relative to the labpack directory

  Rig_w_remote_server:  # The rig server already runs on another machine; the GUI connects to it.
    data_directory: /home/johndoe/Desktop
    screen_center: [0, 0]
    loco_available: True
    # trigger: DAQonServer()   # use when the DAQ hardware lives on the server machine
    server_options:
      use_remote_server: True
      host: '192.168.1.42'     # the RIG machine's address, as seen from this client
      port: 60629
      # Where the SERVER should write locomotion / position logs (a path on the rig machine).
      data_directory: /data/johndoe/stimpack_data


# All paths below are relative to the labpack directory recorded in stimpack's path_to_labpack.txt
parameter_presets_dir: presets/johndoe   # where your saved parameter presets live

module_paths:
  protocol:  # user protocol classes; may be a list of modules
    - template_labpack/protocol/JohnDoe_protocol.py
  data: template_labpack/data.py      # class must be named "Data".   Only one module.
  client: template_labpack/client.py  # class must be named "Client". Only one module.
  daq: template_labpack/device/daq.py # daq module.                   Only one module.
  visual_stim:  # custom stimulus modules, exec'd on the SERVER; may be a list of directories
    - template_labpack/visual_stim/example

# NOTE: custom stimuli belong under module_paths.visual_stim (above). An older layout put them in
# server_options.visual_stim_module_paths -- current stimpack does NOT read that key, so stimuli
# listed there are silently never loaded and referencing them fails with "0 stimulus candidates".
